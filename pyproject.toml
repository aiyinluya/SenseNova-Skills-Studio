[project]
name = "sn-skills-studio"
version = "0.1.0"
description = "SenseNova Skills Studio — local Gradio control panel for sn-* skills"
readme = "README_CN_STUDIO.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.12.0,<6.0.0",
    "huggingface_hub>=0.33.5,<2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["sn_studio/tests", "tests"]
pythonpath = ["."]

[project.scripts]
sn-studio = "sn_studio.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sn_studio*"]
